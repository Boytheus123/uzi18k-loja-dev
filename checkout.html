<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | UZI18K</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px}.brand{display:block;width:190px;height:auto;margin:0 0 18px 0}.brand img{display:block;width:100%;height:auto}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:20px}.title{font-size:22px;margin:0 0 18px}.muted{color:#aaa}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#bbb;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:9px;border:1px solid #333;background:#181818;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#d4af37;color:#080808;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.option{padding:12px;border:1px solid #333;border-radius:10px;margin:8px 0;cursor:pointer}.option:hover{border-color:#d4af37}.error{color:#ff7070;margin-top:10px}.total{font-size:22px;font-weight:800}.back{color:#d4af37;text-decoration:none;display:inline-block;margin-bottom:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><img src="./logo-uzi18k.svg" alt="UZI18K Semi Joias"></div>
<a class="back" href="./">← Voltar para a loja</a>
<div class="grid">
<section class="card">
<h1 class="title">Finalizar compra</h1>
<div class="field"><label>CEP de entrega</label><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"></div>
<button class="btn" id="quote">Calcular frete</button>
<div id="shipping" style="margin-top:18px"></div>
<hr style="border-color:#292929;margin:22px 0">
<h2 style="font-size:17px">Seus dados</h2>
<div class="field"><label>Nome completo</label><input id="name"></div>
<div class="field"><label>E-mail</label><input id="email" type="email"></div>
<div class="row"><div class="field"><label>Telefone</label><input id="phone"></div><div class="field"><label>CPF</label><input id="document"></div></div>
<div class="row"><div class="field"><label>Número</label><input id="number"></div><div class="field"><label>Complemento</label><input id="complement"></div></div>
<div class="field"><label>Endereço</label><input id="address"></div>
<div class="row"><div class="field"><label>Bairro</label><input id="neighborhood"></div><div class="field"><label>Cidade/UF</label><input id="cityState"></div></div>
<div class="error" id="error"></div>
</section>
<aside class="card">
<h2 class="title">Resumo</h2>
<div id="items" class="muted">Carregando carrinho...</div>
<div style="display:flex;justify-content:space-between;margin-top:20px"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div>
<div style="display:flex;justify-content:space-between;margin-top:10px"><span>Frete</span><strong id="freight">A calcular</strong></div>
<hr style="border-color:#292929;margin:18px 0">
<div style="display:flex;justify-content:space-between"><span>Total</span><span class="total" id="total">R$ 0,00</span></div>
<button class="btn" style="margin-top:20px" id="continue" disabled>Continuar para pagamento</button>
</aside>
</div>
</div>
<script>
const API="https://meulxqleymbjkedaagby.supabase.co/functions/v1/checkout-api";
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v||0));
const clean=v=>String(v||"").replace(/\D/g,"");

function normalizeCart(raw){
  if(!raw) return [];
  if(typeof raw==="string"){try{return normalizeCart(JSON.parse(raw))}catch{return []}}
  if(Array.isArray(raw)) return raw;
  if(typeof raw==="object"){
    for(const k of ["items","cart","carrinho","products","produtos"]){
      if(Array.isArray(raw[k])) return raw[k];
    }
  }
  return [];
}
function scoreCart(arr){
  return arr.reduce((n,i)=>{
    if(!i||typeof i!=="object") return n;
    const hasName=!!(i.name||i.product_name||i.title||i.nome);
    const hasPrice=i.price!=null||i.preco!=null||i.unit_price!=null||i.valor!=null;
    const hasQty=i.quantity!=null||i.qty!=null||i.quantidade!=null;
    const hasKey=!!(i.product_key||i.productKey||i.key||i.id);
    return n+(hasName?3:0)+(hasPrice?3:0)+(hasQty?1:0)+(hasKey?1:0);
  },0);
}
function readCart(){
  const candidates=[];
  const add=(source,raw)=>{const arr=normalizeCart(raw);if(arr.length&&scoreCart(arr)>=Math.max(3,arr.length*3))candidates.push({source,arr,score:scoreCart(arr)})};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i); if(!k) continue;
    const v=localStorage.getItem(k);
    add("localStorage:"+k,v);
  }
  for(let i=0;i<sessionStorage.length;i++){
    const k=sessionStorage.key(i); if(!k) continue;
    const v=sessionStorage.getItem(k);
    add("sessionStorage:"+k,v);
  }
  for(const k of ["cart","carrinho","uziCart","uzi18kCart","cartItems","cartItemsUzi18k"]){
    try{add("global:"+k,window[k])}catch{}
  }
  if(window.uziCart&&typeof window.uziCart==="object")add("window.uziCart",window.uziCart);
  if(window.cart&&typeof window.cart==="object")add("window.cart",window.cart);
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]?.arr||[];
}
let cart=readCart(),subtotal=0,shipping=null;
const itemsEl=document.getElementById("items");
if(!cart.length){itemsEl.textContent="Seu carrinho está vazio."}else{
 itemsEl.innerHTML=cart.map(i=>{const q=Number(i.quantity||i.qty||i.quantidade||1),p=Number(i.price??i.preco??i.unit_price??i.valor??0);return '<div style="padding:9px 0;border-bottom:1px solid #292929">'+(i.name||i.product_name||i.title||i.nome||"Produto")+' <span class="muted">× '+q+'</span><div>'+money(p*q)+'</div></div>'}).join("");
 subtotal=cart.reduce((s,i)=>s+Number(i.price??i.preco??i.unit_price??i.valor??0)*Number(i.quantity||i.qty||i.quantidade||1),0);
}
document.getElementById("subtotal").textContent=money(subtotal);
document.getElementById("total").textContent=money(subtotal);
document.getElementById("cep").addEventListener("input",e=>{let v=clean(e.target.value).slice(0,8);e.target.value=v.length>5?v.slice(0,5)+"-"+v.slice(5):v});
document.getElementById("quote").onclick=async()=>{
 const cep=clean(document.getElementById("cep").value); if(cep.length!==8)return;
 const el=document.getElementById("shipping");el.innerHTML='<span class="muted">Calculando...</span>';
 try{
  const apiItems=cart.map(i=>({product_key:i.product_key||i.productKey||i.key||i.productId||i.id,variant:i.variant||i.size||i.tamanho||null,quantity:Number(i.quantity||i.qty||i.quantidade||1),unit_price:Number(i.price??i.preco??i.unit_price??i.valor??0)}));
  const res=await fetch(API+"/shipping/quote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({destination_cep:cep,items:apiItems})});
  const data=await res.json();if(!res.ok)throw new Error(data.error||"Erro ao calcular");
  el.innerHTML=(data.quotes||[]).map((q,n)=>'<div class="option" data-i="'+n+'"><strong>'+q.name+'</strong><br><span class="muted">'+(q.company||"")+(q.delivery_time?" · "+q.delivery_time+" dias úteis":"")+'</span><br><strong>'+money(q.price)+'</strong></div>').join("")||'<span class="muted">Nenhuma opção disponível.</span>';
  el.querySelectorAll(".option").forEach(o=>o.onclick=()=>{el.querySelectorAll(".option").forEach(x=>x.style.borderColor="#333");o.style.borderColor="#d4af37";shipping=data.quotes[Number(o.dataset.i)];document.getElementById("freight").textContent=money(shipping.price);document.getElementById("total").textContent=money(subtotal+shipping.price);document.getElementById("continue").disabled=false});
 }catch(e){el.innerHTML='<span class="error">'+e.message+"</span>"}
};
</script>
</body></html>
