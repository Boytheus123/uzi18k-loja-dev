name: temporary-uzi18k-menu-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'fix: UZI18K section and footer links' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix section and footer links
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old = '<div><h4>COMPRE</h4><a href="#mais-vendidos">Mais vendidos</a><a href="#correntes">Correntes</a><a href="#pulseiras">Pulseiras</a><a href="#">Kits</a></div>'
          new = '<div><h4>COMPRE</h4><a href="#mais-vendidos">Mais vendidos</a><a href="#correntes">Correntes</a><a href="#pulseiras">Pulseiras</a><a href="#pingentes">Pingentes</a></div>'
          if s.count(old) != 1:
              raise SystemExit(f"COMPRE target count: {s.count(old)}")
          s = s.replace(old, new, 1)

          old = '<div><h4>UZI18K</h4><a href="#manifesto">Sobre a marca</a><a href="https://www.instagram.com/uzi.18k/" rel="noopener noreferrer" target="_blank">Instagram @uzi.18k</a><a href="#">Política de privacidade</a><a href="#">Termos</a></div>'
          new = '<div><h4>UZI18K</h4><a href="#manifesto">A UZI18K</a><a href="#feedbacks">Feedbacks</a><a href="https://www.instagram.com/uzi.18k/" rel="noopener noreferrer" target="_blank">Instagram @uzi.18k</a><a href="#">Política de privacidade</a><a href="#">Termos</a></div>'
          if s.count(old) != 1:
              raise SystemExit(f"UZI18K target count: {s.count(old)}")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temporary-uzi18k-menu-fix.yml
          git commit -m "fix: UZI18K section and footer links"
          git push
