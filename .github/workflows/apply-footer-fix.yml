name: Apply footer fix DEV

on: [push]

permissions:
  contents: write

jobs:
  fix-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply footer fix
        run: python scripts/fix_footer.py
      - name: Commit footer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: corrigir navegacao do footer no DEV"
          git push
