name: UZI18K product cart fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix product cart
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='<script id="uzi-v124-product-cart-click-fix">'
          if marker not in s:
              fix='''<script id="uzi-v124-product-cart-click-fix">
(function(){
  document.addEventListener('click',function(e){
    var el=e.target.closest&&e.target.closest('#uziGlobalProductCart,#uziHeaderCartButton,.uzi-cart-trigger');
    if(!el||el.closest('#uziCartDrawer')) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if(typeof window.uzi18kOpenCart==='function') window.uzi18kOpenCart();
  },true);
})();
</script>
'''
              s=s.replace('</body>',fix+'</body>')
              p.write_text(s,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: garantir abertura do carrinho no produto" && git push)
