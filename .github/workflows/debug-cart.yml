name: Debug cart structure

on:
  push:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract cart structure
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8",errors="ignore")
          terms=["produto-pulseira-cartier","Seu carrinho","Remover","Pagamento no Pix","Tamanho:","cart"]
          out=[]
          for term in terms:
              out.append("\n===== TERM: "+term+" =====")
              pos=0
              found=0
              while found<5:
                  i=s.lower().find(term.lower(),pos)
                  if i<0: break
                  a=max(0,i-2500); b=min(len(s),i+5000)
                  out.append(s[a:b])
                  pos=i+len(term); found+=1
          Path("cart-debug.txt").write_text("\n".join(out),encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cart-debug.txt
          git diff --cached --quiet || (git commit -m "debug: inspect cart DOM structure" && git push)
