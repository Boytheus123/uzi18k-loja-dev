name: Fix product cart access DEV

on: [push]

permissions:
  contents: write

jobs:
  fix-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix product cart access
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="body:has(.v75-product-page:target) #uziGlobalProductCart{display:grid!important;}"
          new=old+"\nbody.uzi-product-active #uziGlobalProductCart{display:grid!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;}"
          if old in s and "body.uzi-product-active #uziGlobalProductCart" not in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding="utf-8")
          else:
              print("target already fixed or selector not found")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: manter carrinho acessivel nas paginas de produto"
          git push
