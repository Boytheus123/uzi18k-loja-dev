name: Fix footer navigation DEV

on:
  push:
    paths:
      - ".github/workflows/fix-footer-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix footer navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              '<a href="#mais-vendidos">Mais vendidos</a><a href="#correntes">Correntes</a><a href="#pulseiras">Pulseiras</a><a href="#">Kits</a>',
              '<a href="#mais-vendidos">Mais vendidos</a><a href="#correntes">Correntes</a><a href="#pulseiras">Pulseiras</a><a href="#pingentes">Pingentes</a>'
          )
          s = s.replace(
              '<a href="#manifesto">Sobre a marca</a><a href="https://www.instagram.com/uzi.18k/" rel="noopener noreferrer" target="_blank">Instagram @uzi.18k</a><a href="#">Política de privacidade</a><a href="#">Termos</a>',
              '<a href="#manifesto">Sobre a marca</a><a href="#feedbacks">Feedbacks</a><a href="https://www.instagram.com/uzi.18k/" rel="noopener noreferrer" target="_blank">Instagram @uzi.18k</a><a href="#">Política de privacidade</a><a href="#">Termos</a>'
          )

          marker = '<script id="uzi-footer-navigation-fix">'
          if marker not in s:
              fix = r'''<script id="uzi-footer-navigation-fix">
(function(){
  function goFooterTarget(e){
    var link=e.target.closest && e.target.closest('.footer a[href^="#"]');
    if(!link) return;
    var href=link.getAttribute('href')||'';
    if(href==='#') return;
    var id=href.slice(1);
    var target=document.getElementById(id);
    if(!target) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var header=document.querySelector('.header');
    var topbar=document.querySelector('.topbar');
    var offset=(header?header.getBoundingClientRect().height:0)+(topbar?topbar.getBoundingClientRect().height:0)+12;
    var top=target.getBoundingClientRect().top+(window.pageYOffset||window.scrollY||0)-offset;
    window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
    try{history.pushState({uzi18kFooter:id},'', '#'+id);}catch(_){}
  }
  document.addEventListener('click',goFooterTarget,true);
})();
</script>
'''
              s = s.replace('</body>', fix + '</body>')

          p.write_text(s, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: corrigir navegacao do footer no DEV"
          git push

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-footer-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-footer-navigation.yml
          git commit -m "chore: remove temporary footer workflow" || true
          git push
